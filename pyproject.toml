[project]
name = "scalper-bot"
version = "1.1.0"
description = "EMA/RSI/ATR scalping bot for Deriv (WebSocket API) and MetaTrader 5 (HFM, Deriv MT5)"
requires-python = ">=3.9"
dependencies = ["websockets>=12,<18", "PyYAML>=6"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
scalper = "scalper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scalper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
